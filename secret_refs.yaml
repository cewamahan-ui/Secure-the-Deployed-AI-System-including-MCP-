# secret_refs.yaml - REFERENCES ONLY, never values (Week 9, Deliverable 1)
#
# This file is the documented fallback for the "no Azure Key Vault"
# path in the brief. Every entry names WHERE the secret lives and how
# resolve_secrets.py should pull it. Committing this file is safe:
# grep it for a value and you will find none.
#
# Primary path (with a Key Vault): the same names are Key Vault secret
# ids, and a sidecar/init container writes them into the process env
# (azure key-vault-provider or `az keyvault secret show`). The app code
# only ever reads os.environ, so the swap is one deploy step, not a code
# change. See kms_twin.json for the AWS twin card.

version: 1

secrets:
  JWT_SECRET:
    kind: env-injection
    env_var: JWT_SECRET
    source: azure-key-vault:afyaplus-prod/kv-jwt-secret   # primary path
    fallback: process environment injected at deploy      # this lab's path
    rotation_days: 90
    owner: platform-security
    used_by: [triage_api.auth]
    note: HS256 signing key. Never logged, never defaulted. Boot fails closed without it.

  AZURE_KEY_VAULT_URI:
    kind: env-injection
    env_var: AZURE_KEY_VAULT_URI
    source: azure-key-vault:afyaplus-prod/kv-vault-uri
    fallback: absent (documented fallback, see kms_twin.json)
    rotation_days: 365
    owner: platform-security
    used_by: [scripts/vault_sidecar.py - not used in the lab path]
    note: Absent in the lab. The twin card in kms_twin.json covers the audit story.

  AWS_KMS_KEY_ID:
    kind: env-injection
    env_var: AWS_KMS_KEY_ID
    source: aws-kms:alias/afyaplus-at-rest
    fallback: absent (documented fallback, see kms_twin.json)
    rotation_days: 365
    owner: platform-security
    used_by: [encrypt_at_rest.py - at-rest master key reference]
    note: Absent in the lab. encrypt_at_rest.py works against the local
          teaching key and records the KMS reference for the auditor.

# NOT a secret, kept next to the refs so reviewers see the whole story:
# docker-compose.yml references ${JWT_SECRET} (no default), so
# `docker compose up` refuses to start with an unset variable. That is
# the fail-closed boot at the deploy layer; resolve_secrets.py is the
# same gate at the process layer.
